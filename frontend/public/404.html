<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · archv3d</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Cloudflare Pages serves this, with status 404, for any path that isn't a file. Self-contained: it can be shown
         at any depth, so it links and loads nothing relative. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1013;
        color: #f2f2f0;
        font: 16px/1.6 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p.kicker { color: #d9b77e; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 12px; }
      h1 { font: 400 clamp(40px, 8vw, 64px) / 1.05 'Iowan Old Style', Georgia, serif; margin: 0 0 16px; }
      p { color: rgba(242, 242, 240, 0.7); margin: 0 0 32px; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #d9b77e;
        color: #1d1a14;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #f2f2f0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be old or mistyped. The experiences and the portfolio are on the home page.</p>
      <a href="/">Go to archv3d.com</a>
    </main>
  </body>
</html>
